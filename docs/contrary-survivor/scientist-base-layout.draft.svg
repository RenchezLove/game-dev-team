<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H8M0 0V8" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <style>
    .have{fill:#cfe8c9;stroke:#3c7a36;stroke-width:2}
    .new{fill:#ffe0b8;stroke:#c26a00;stroke-width:2}
    .npc{fill:#2f6fd0;stroke:#123a7a;stroke-width:2}
    .guard{fill:#b3261e;stroke:#5c0f0b;stroke-width:2}
    .lbl{fill:#1c1c1c}
    .sm{font-size:13px;fill:#444}
    .b{font-weight:700}
  </style>

  <rect width="1400" height="980" fill="#e9e4d4"/>
  <text x="30" y="42" font-size="24" class="b lbl">База учёных — схема размещения (черновик, вид сверху)</text>
  <text x="30" y="68" class="sm">Размер площадки примерно 45 на 32 метра. Вход один, с южной стороны, от дороги.</text>

  <!-- дорога -->
  <rect x="0" y="860" width="1070" height="56" fill="#b9ad93"/>
  <rect x="570" y="790" width="60" height="70" fill="#b9ad93"/>
  <text x="40" y="894" class="sm">дорога (к деревне)</text>

  <!-- площадка -->
  <rect x="150" y="130" width="900" height="650" fill="#d8d2b8"/>
  <!-- забор из сетки -->
  <g fill="url(#mesh)" stroke="#c26a00" stroke-width="2">
    <rect x="144" y="124" width="912" height="12"/>
    <rect x="144" y="124" width="12" height="662"/>
    <rect x="1044" y="124" width="12" height="662"/>
    <rect x="144" y="774" width="416" height="12"/>
    <rect x="640" y="774" width="416" height="12"/>
  </g>
  <text x="160" y="118" class="lbl">Забор из сетки-рабицы на бетонных столбах</text>

  <!-- шлагбаум -->
  <line x1="556" y1="780" x2="648" y2="780" stroke="#c26a00" stroke-width="7"/>
  <line x1="556" y1="780" x2="648" y2="780" stroke="#fff" stroke-width="7" stroke-dasharray="12 12"/>
  <rect x="544" y="770" width="16" height="20" class="new"/>
  <text x="470" y="812" class="lbl" text-anchor="end">Шлагбаум из трубы</text>
  <text x="470" y="830" class="sm" text-anchor="end">с противовесом, красно-белый</text>

  <!-- табличка -->
  <rect x="500" y="836" width="56" height="16" class="new"/>
  <text x="494" y="850" class="sm" text-anchor="end">табличка «Посторонним вход воспрещён»</text>

  <!-- будка сторожа -->
  <rect x="650" y="716" width="54" height="54" class="new"/>
  <text x="677" y="748" text-anchor="middle" class="sm">будка</text>
  <!-- сторож -->
  <circle cx="620" cy="744" r="13" class="guard"/>
  <text x="620" y="749" text-anchor="middle" fill="#fff" class="b">С</text>
  <text x="660" y="812" class="lbl b">Сторож с двустволкой</text>

  <!-- буханка -->
  <rect x="760" y="690" width="110" height="52" rx="10" class="new"/>
  <text x="815" y="713" text-anchor="middle" class="lbl">УАЗ «буханка»</text>
  <text x="815" y="731" text-anchor="middle" class="sm">экспедиционный</text>

  <!-- палатка 1 -->
  <rect x="200" y="170" width="250" height="160" class="new"/>
  <line x1="200" y1="250" x2="450" y2="250" stroke="#c26a00" stroke-dasharray="6 5"/>
  <text x="325" y="205" text-anchor="middle" class="lbl b">Большая брезентовая палатка</text>
  <text x="325" y="226" text-anchor="middle" class="lbl">Лаборатория</text>
  <rect x="212" y="268" width="112" height="34" class="have"/>
  <text x="268" y="290" text-anchor="middle" class="sm">стол, приборы</text>
  <rect x="340" y="268" width="34" height="34" class="have"/>
  <text x="384" y="290" class="sm">ящик</text>
  <circle cx="325" cy="356" r="13" class="npc"/>
  <text x="325" y="361" text-anchor="middle" fill="#fff" class="b">В</text>
  <text x="346" y="361" class="lbl b">Вера, руководитель</text>
  <text x="346" y="379" class="sm">выдаёт задания</text>

  <!-- палатка 2 -->
  <rect x="530" y="170" width="250" height="160" class="new"/>
  <line x1="530" y1="250" x2="780" y2="250" stroke="#c26a00" stroke-dasharray="6 5"/>
  <text x="655" y="205" text-anchor="middle" class="lbl b">Большая брезентовая палатка</text>
  <text x="655" y="226" text-anchor="middle" class="lbl">Медпункт (красный крест на входе)</text>
  <rect x="552" y="268" width="80" height="34" class="have"/>
  <text x="592" y="290" text-anchor="middle" class="sm">стол</text>
  <rect x="656" y="268" width="108" height="34" class="new"/>
  <text x="710" y="290" text-anchor="middle" class="sm">раскладушка</text>
  <circle cx="610" cy="356" r="13" class="npc"/>
  <text x="610" y="361" text-anchor="middle" fill="#fff" class="b">Д</text>
  <text x="631" y="361" class="lbl b">Врач</text>
  <text x="631" y="379" class="sm">лекарства и броня</text>
  <circle cx="800" cy="372" r="9" class="new"/>
  <text x="800" y="400" text-anchor="middle" class="sm">рукомойник</text>

  <!-- сарай -->
  <rect x="860" y="180" width="160" height="130" class="have"/>
  <text x="940" y="235" text-anchor="middle" class="lbl b">Сарай</text>
  <text x="940" y="256" text-anchor="middle" class="lbl">склад, переделан</text>
  <rect x="872" y="322" width="46" height="34" class="new"/>
  <text x="895" y="374" text-anchor="middle" class="lbl b">Личный ящик</text>
  <rect x="972" y="322" width="56" height="36" class="new"/>
  <text x="1000" y="398" text-anchor="middle" class="sm">генератор</text>
  <circle cx="972" cy="430" r="11" class="have"/><circle cx="998" cy="440" r="11" class="have"/><circle cx="982" cy="456" r="11" class="have"/>
  <text x="985" y="486" text-anchor="middle" class="sm">бочки с топливом</text>
  <!-- верёвка -->
  <line x1="790" y1="200" x2="852" y2="200" stroke="#3c7a36" stroke-width="3"/>
  <text x="821" y="190" text-anchor="middle" class="sm">бельё</text>

  <!-- костёр -->
  <circle cx="600" cy="520" r="20" class="have"/>
  <circle cx="600" cy="520" r="8" fill="#e2572b"/>
  <text x="600" y="462" text-anchor="middle" class="lbl b">Костёр — точка сохранения</text>
  <rect x="545" y="556" width="110" height="14" class="have"/>
  <text x="600" y="588" text-anchor="middle" class="sm">скамейка</text>
  <rect x="520" y="476" width="14" height="88" class="have"/>
  <rect x="680" y="496" width="62" height="44" class="have"/>
  <text x="711" y="523" text-anchor="middle" class="sm">стол</text>
  <circle cx="726" cy="506" r="7" class="new"/>
  <text x="752" y="510" class="sm">самовар и кружки</text>
  <rect x="690" y="580" width="74" height="18" class="have"/>
  <text x="727" y="616" text-anchor="middle" class="sm">поленница, колода</text>
  <circle cx="782" cy="589" r="8" class="have"/>

  <!-- площадка опытов -->
  <rect x="190" y="470" width="190" height="150" class="have" fill-opacity="0.55"/>
  <text x="285" y="494" text-anchor="middle" class="lbl b">Навес для опытов</text>
  <rect x="222" y="520" width="44" height="44" rx="8" class="new"/>
  <text x="244" y="582" text-anchor="middle" class="sm">кресло</text>
  <text x="244" y="598" text-anchor="middle" class="sm">со шлемом</text>
  <circle cx="320" cy="540" r="13" class="npc"/>
  <text x="320" y="545" text-anchor="middle" fill="#fff" class="b">Л</text>
  <text x="285" y="642" text-anchor="middle" class="lbl b">Лаборант</text>
  <text x="285" y="660" text-anchor="middle" class="sm">«эксперименты» — реклама за монеты</text>

  <!-- мачта -->
  <circle cx="210" cy="720" r="10" class="new"/>
  <line x1="210" y1="720" x2="180" y2="750" stroke="#c26a00"/><line x1="210" y1="720" x2="244" y2="748" stroke="#c26a00"/><line x1="210" y1="720" x2="210" y2="684" stroke="#c26a00"/>
  <text x="232" y="716" class="lbl">Мачта с антенной</text>

  <!-- метеобудка -->
  <rect x="470" y="650" width="30" height="30" class="new"/>
  <text x="485" y="700" text-anchor="middle" class="lbl">Метеобудка</text>
  <text x="485" y="718" text-anchor="middle" class="sm">белая, на ножках</text>

  <!-- ящики у входа -->
  <rect x="900" y="620" width="30" height="30" class="have"/><rect x="934" y="628" width="30" height="30" class="have"/>
  <text x="932" y="676" text-anchor="middle" class="sm">ящики</text>

  <!-- деревья -->
  <g fill="#9fb98a" stroke="#6d8a58">
    <circle cx="90" cy="200" r="26"/><circle cx="70" cy="420" r="22"/><circle cx="100" cy="640" r="26"/>
    <circle cx="300" cy="90" r="18"/><circle cx="1000" cy="820" r="22"/><circle cx="820" cy="96" r="16"/>
  </g>

  <!-- север и масштаб -->
  <g transform="translate(1010,880)"><line x1="0" y1="50" x2="0" y2="0" stroke="#222" stroke-width="3"/><path d="M-8 14L0 0L8 14Z" fill="#222"/><text x="12" y="16" class="b lbl">С</text></g>
  <line x1="150" y1="940" x2="350" y2="940" stroke="#222" stroke-width="3"/>
  <line x1="150" y1="933" x2="150" y2="947" stroke="#222" stroke-width="3"/><line x1="350" y1="933" x2="350" y2="947" stroke="#222" stroke-width="3"/>
  <text x="250" y="964" text-anchor="middle" class="sm">10 метров</text>

  <!-- легенда -->
  <rect x="1090" y="124" width="290" height="330" fill="#fff" stroke="#999"/>
  <text x="1108" y="156" class="b lbl" font-size="17">Обозначения</text>
  <rect x="1108" y="176" width="30" height="20" class="have"/>
  <text x="1150" y="192" class="lbl">модель уже есть в игре</text>
  <rect x="1108" y="212" width="30" height="20" class="new"/>
  <text x="1150" y="228" class="lbl">модель нужно сделать</text>
  <circle cx="1123" cy="262" r="12" class="npc"/>
  <text x="1150" y="267" class="lbl">учёный</text>
  <circle cx="1123" cy="298" r="12" class="guard"/>
  <text x="1150" y="303" class="lbl">охрана</text>
  <text x="1108" y="344" class="sm">Вход закрыт шлагбаумом, пока</text>
  <text x="1108" y="362" class="sm">герой не сдал задание на бандитов.</text>
  <text x="1108" y="392" class="sm">Личный ящик общий с ящиком</text>
  <text x="1108" y="410" class="sm">в деревне.</text>
  <text x="1108" y="438" class="sm">Место базы на карте не выбрано.</text>
</svg>
