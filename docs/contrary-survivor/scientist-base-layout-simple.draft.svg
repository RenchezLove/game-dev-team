<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H8M0 0V8" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <style>
    .bld{fill:#ffe0b8;stroke:#c26a00;stroke-width:2}
    .prop{fill:#cfe8c9;stroke:#3c7a36;stroke-width:2}
    .npc{fill:#2f6fd0;stroke:#123a7a;stroke-width:2}
    .guard{fill:#b3261e;stroke:#5c0f0b;stroke-width:2}
    .lbl{fill:#1c1c1c}
    .sm{font-size:13px;fill:#444}
    .b{font-weight:700}
  </style>

  <rect width="1100" height="820" fill="#e9e4d4"/>
  <text x="30" y="42" font-size="24" class="b lbl">База учёных — простой полевой лагерь (черновик, вид сверху)</text>
  <text x="30" y="68" class="sm">Размер площадки примерно 30 на 22 метра. Вход один, с южной стороны, от дороги.</text>

  <!-- дорога -->
  <rect x="0" y="650" width="780" height="50" fill="#b9ad93"/>
  <rect x="420" y="576" width="60" height="74" fill="#b9ad93"/>
  <text x="40" y="681" class="sm">дорога</text>

  <!-- площадка -->
  <rect x="150" y="130" width="600" height="440" fill="#d8d2b8"/>
  <!-- забор -->
  <g fill="url(#mesh)" stroke="#c26a00" stroke-width="2">
    <rect x="144" y="124" width="612" height="12"/>
    <rect x="144" y="124" width="12" height="452"/>
    <rect x="744" y="124" width="12" height="452"/>
    <rect x="144" y="564" width="266" height="12"/>
    <rect x="490" y="564" width="266" height="12"/>
  </g>
  <text x="160" y="118" class="lbl">Забор из сетки-рабицы</text>

  <!-- шлагбаум -->
  <line x1="406" y1="570" x2="494" y2="570" stroke="#c26a00" stroke-width="7"/>
  <line x1="406" y1="570" x2="494" y2="570" stroke="#fff" stroke-width="7" stroke-dasharray="12 12"/>
  <text x="396" y="602" class="lbl b" text-anchor="end">Шлагбаум</text>
  <text x="396" y="620" class="sm" text-anchor="end">закрыт до сдачи задания на бандитов</text>

  <!-- охрана -->
  <circle cx="520" cy="538" r="13" class="guard"/>
  <text x="520" y="543" text-anchor="middle" fill="#fff" class="b">?</text>
  <text x="500" y="602" class="lbl b">Охрана у входа</text>
  <text x="500" y="620" class="sm">кто охраняет — не решено</text>

  <!-- палатка -->
  <rect x="190" y="170" width="160" height="100" class="bld"/>
  <line x1="190" y1="220" x2="350" y2="220" stroke="#c26a00" stroke-dasharray="6 5"/>
  <text x="270" y="196" text-anchor="middle" class="lbl b">Большая палатка</text>
  <text x="270" y="213" text-anchor="middle" class="sm">жильё и рабочее место</text>
  <rect x="204" y="234" width="132" height="26" class="prop"/>
  <text x="270" y="252" text-anchor="middle" class="sm">стол с приборами</text>

  <!-- учёный -->
  <circle cx="270" cy="300" r="13" class="npc"/>
  <text x="270" y="305" text-anchor="middle" fill="#fff" class="b">У</text>
  <text x="292" y="298" class="lbl b">Учёный</text>
  <text x="292" y="316" class="sm">выдаёт задания</text>

  <!-- верёвка -->
  <line x1="370" y1="190" x2="520" y2="190" stroke="#3c7a36" stroke-width="3"/>
  <text x="445" y="180" text-anchor="middle" class="sm">верёвка с бельём</text>

  <!-- ящики -->
  <rect x="540" y="200" width="26" height="26" class="prop"/>
  <rect x="548" y="230" width="26" height="26" class="prop"/>
  <text x="556" y="276" text-anchor="middle" class="sm">ящики</text>

  <!-- сарай -->
  <rect x="590" y="165" width="120" height="100" class="bld"/>
  <text x="650" y="212" text-anchor="middle" class="lbl b">Сарай</text>
  <text x="650" y="231" text-anchor="middle" class="sm">склад</text>
  <rect x="600" y="282" width="40" height="30" class="prop"/>
  <text x="620" y="332" text-anchor="middle" class="lbl b">Личный ящик</text>
  <circle cx="696" cy="296" r="11" class="prop"/><circle cx="720" cy="306" r="11" class="prop"/><circle cx="704" cy="322" r="11" class="prop"/>
  <text x="708" y="354" text-anchor="middle" class="sm">бочки</text>

  <!-- костёр -->
  <circle cx="450" cy="400" r="20" class="prop"/>
  <circle cx="450" cy="400" r="8" fill="#e2572b"/>
  <text x="450" y="366" text-anchor="middle" class="lbl b">Костёр — точка сохранения</text>
  <rect x="395" y="436" width="110" height="14" class="prop"/>
  <text x="450" y="468" text-anchor="middle" class="sm">скамейка</text>
  <rect x="330" y="386" width="18" height="60" class="prop"/>
  <text x="339" y="464" text-anchor="middle" class="sm">дрова</text>
  <rect x="540" y="382" width="56" height="40" class="prop"/>
  <text x="568" y="407" text-anchor="middle" class="sm">стол</text>
  <text x="568" y="440" text-anchor="middle" class="sm">чайник, кружки</text>

  <!-- буханка -->
  <rect x="580" y="490" width="96" height="44" rx="10" class="bld"/>
  <text x="628" y="509" text-anchor="middle" class="lbl b">УАЗ</text>
  <text x="628" y="526" text-anchor="middle" class="sm">«буханка»</text>

  <!-- деревья -->
  <g fill="#9fb98a" stroke="#6d8a58">
    <circle cx="80" cy="200" r="26"/><circle cx="70" cy="400" r="22"/><circle cx="95" cy="560" r="24"/>
    <circle cx="330" cy="92" r="16"/><circle cx="600" cy="94" r="16"/><circle cx="700" cy="620" r="18"/>
  </g>

  <!-- север и масштаб -->
  <g transform="translate(720,730)"><line x1="0" y1="50" x2="0" y2="0" stroke="#222" stroke-width="3"/><path d="M-8 14L0 0L8 14Z" fill="#222"/><text x="12" y="16" class="b lbl">С</text></g>
  <line x1="150" y1="760" x2="350" y2="760" stroke="#222" stroke-width="3"/>
  <line x1="150" y1="753" x2="150" y2="767" stroke="#222" stroke-width="3"/><line x1="350" y1="753" x2="350" y2="767" stroke="#222" stroke-width="3"/>
  <text x="250" y="784" text-anchor="middle" class="sm">10 метров</text>

  <!-- легенда -->
  <rect x="790" y="124" width="290" height="270" fill="#fff" stroke="#999"/>
  <text x="808" y="156" class="b lbl" font-size="17">Обозначения</text>
  <rect x="808" y="176" width="30" height="20" class="bld"/>
  <text x="850" y="192" class="lbl">постройки и машина</text>
  <rect x="808" y="212" width="30" height="20" class="prop"/>
  <text x="850" y="228" class="lbl">мелкие предметы</text>
  <circle cx="823" cy="262" r="12" class="npc"/>
  <text x="850" y="267" class="lbl">учёный</text>
  <circle cx="823" cy="298" r="12" class="guard"/>
  <text x="850" y="303" class="lbl">охрана</text>
  <text x="808" y="340" class="sm">Личный ящик общий с ящиком</text>
  <text x="808" y="358" class="sm">в деревне.</text>
  <text x="808" y="382" class="sm">Место базы на карте не выбрано.</text>
</svg>
