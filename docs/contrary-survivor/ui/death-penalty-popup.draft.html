<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family:"Segoe UI",Arial,sans-serif;
    /* затемнённый игровой экран: приглушённая среда + тёплый отсвет костра снизу-по-центру */
    background:
      radial-gradient(120% 70% at 50% 112%, rgba(224,163,46,.18), rgba(224,163,46,0) 45%),
      radial-gradient(140% 120% at 50% 40%, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%),
      linear-gradient(160deg, #2B3A2C 0%, #3F5A31 38%, #2B3A2C 72%, #1b2417 100%);
    display:flex; align-items:center; justify-content:center;
  }

  /* ===== ПОПАП ===== */
  .popup {
    width:660px;
    background:linear-gradient(180deg,#1B2018 0%, #141811 100%);
    border:1px solid rgba(231,228,216,.16);
    border-radius:12px;
    box-shadow:0 26px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4);
    overflow:hidden;
  }
  /* верхняя акцент-полоса (опасность/штраф) */
  .accent { height:4px; background:linear-gradient(90deg,#8A2F2A 0%, #C64B2C 50%, #8A2F2A 100%); }

  .inner { padding:30px 36px 26px; }

  /* шапка */
  .head { display:flex; align-items:center; gap:16px; margin-bottom:6px; }
  .head .ico { width:54px; height:54px; flex:none; }
  .title { color:#E7E4D8; font-size:27px; font-weight:700; letter-spacing:.4px; }
  .subtitle { color:#9AA08C; font-size:15px; margin-top:3px; }

  .rule { height:1px; background:rgba(231,228,216,.10); margin:22px 0; }

  /* строки штрафа */
  .loss { display:flex; align-items:center; gap:18px; padding:4px 0; }
  .loss + .loss { margin-top:18px; }
  .loss .ico { width:46px; height:46px; flex:none; }
  .loss .big { color:#E0A32E; font-size:34px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .loss .txt { color:#E7E4D8; font-size:18px; font-weight:600; }
  .loss .hint { color:#9AA08C; font-size:14px; margin-top:3px; }

  /* безопасно */
  .safe { display:flex; align-items:center; gap:12px; margin-top:24px;
          background:rgba(78,140,70,.10); border:1px solid rgba(78,140,70,.30);
          border-radius:8px; padding:12px 16px; }
  .safe .ico { width:24px; height:24px; flex:none; }
  .safe .txt { color:#C7D2B6; font-size:15px; font-weight:600; }

  /* нижняя строка: окно закроется через несколько секунд */
  .timer { margin-top:26px; }
  .timer .bar { height:5px; background:rgba(231,228,216,.10); border-radius:3px; overflow:hidden; }
  .timer .fill { height:100%; width:62%; background:linear-gradient(90deg,#CAA54E,#E0A32E); border-radius:3px; }
  .timer .cap { display:flex; justify-content:space-between; margin-top:9px; }
  .timer .cap span { color:#7d8674; font-size:12.5px; letter-spacing:.3px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="popup">
    <div class="accent"></div>
    <div class="inner">

      <!-- ШАПКА: костёр + заголовок (вариант В — внутримировой/промежуточный) -->
      <div class="head">
        <svg class="ico" viewBox="0 0 64 64">
          <!-- поленья -->
          <rect x="14" y="46" width="36" height="6.5" rx="3" transform="rotate(-12 32 49)" fill="#7D6A4E"/>
          <rect x="14" y="46" width="36" height="6.5" rx="3" transform="rotate(12 32 49)" fill="#8A5A32"/>
          <!-- пламя -->
          <path d="M32 8 C24 20 38 24 30 34 C44 32 40 16 32 8 Z" fill="#E0A32E"/>
          <path d="M32 16 C27 24 35 27 30 33 C24 40 31 47 32 47 C40 45 44 36 38 28 C35 23 36 20 32 16 Z" fill="#C64B2C"/>
          <path d="M32 26 C29 31 33 33 31 37 C29 41 33 44 33 44 C38 41 38 34 34 30 C33 28 33 27 32 26 Z" fill="#E7E4D8" opacity=".85"/>
        </svg>
        <div>
          <div class="title">Снова у костра</div>
          <div class="subtitle">Ты приходишь в себя у костра в деревне.</div>
        </div>
      </div>

      <div class="rule"></div>

      <!-- ШТРАФ 1: деньги (число -40% — ПЛЕЙСХОЛДЕР, на тюнинг) -->
      <div class="loss">
        <svg class="ico" viewBox="0 0 48 48">
          <ellipse cx="24" cy="34" rx="16" ry="6.5" fill="#9C7A22"/>
          <ellipse cx="24" cy="29" rx="16" ry="6.5" fill="#CAA54E"/>
          <ellipse cx="24" cy="24" rx="16" ry="6.5" fill="#E0A32E"/>
          <ellipse cx="24" cy="24" rx="9.5" ry="3.6" fill="#B5841F"/>
        </svg>
        <div>
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span class="big">&minus;40%</span>
            <span class="txt">монет</span>
          </div>
          <div class="hint">Часть денег утеряна при гибели.</div>
        </div>
      </div>

      <!-- ШТРАФ 2: расходники обронены мешком (иконка мешка — ПЛЕЙСХОЛДЕР) -->
      <div class="loss">
        <svg class="ico" viewBox="0 0 48 48">
          <!-- горловина-завязка -->
          <path d="M18 12 L30 12 L27 19 L21 19 Z" fill="#6E6A60"/>
          <rect x="19" y="10" width="10" height="3.4" rx="1.7" fill="#8A5A32"/>
          <!-- тело мешка -->
          <path d="M21 18 C10 22 9 42 24 42 C39 42 38 22 27 18 Z" fill="#7D6A4E"/>
          <path d="M24 18 C30 21 35 30 33 38 C30 41 27 42 24 42 Z" fill="#6b5b42"/>
          <!-- перетяжка -->
          <path d="M16 24 C20 27 28 27 32 24" stroke="#3a3022" stroke-width="2.4" fill="none"/>
        </svg>
        <div>
          <div class="txt">Расходники обронены на месте гибели</div>
          <div class="hint">Они лежат мешком там, где ты пал — их можно забрать.</div>
        </div>
      </div>

      <!-- БЕЗОПАСНО: снаряжение + квест-предметы целы -->
      <div class="safe">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" fill="#4E8C46"/>
          <path d="M8.5 12 l2.4 2.6 L16 8.6" stroke="#E7E4D8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="txt">Снаряжение, оружие и важные находки целы.</div>
      </div>

      <!-- ТАЙМЕР: попап висит несколько секунд -->
      <div class="timer">
        <div class="bar"><div class="fill"></div></div>
        <div class="cap">
          <span>Возрождение в деревне</span>
          <span>Окно закроется автоматически</span>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
